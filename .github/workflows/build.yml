name: Build

# Sem tags e sem PR obrigatorio: todo push na main roda o smoke test,
# builda o .exe e publica o zip.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se chegarem dois pushes seguidos, o build antigo e cancelado.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Smoke test + build Windows
    runs-on: ubuntu-latest

    env:
      # Precisa vir para o nivel do job: nao da para usar `secrets` direto num `if`.
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Liberar espaco no runner
        # As imagens do GameCI passam de 10 GB e o runner vem com pouco espaco livre.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache da pasta Library
        # Sem isso o Unity reimporta o projeto inteiro a cada execucao.
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Smoke test (EditMode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Smoke test

      - name: Build Windows
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: RemoteChase
          # O test runner deixa arquivos no workspace; sem isto o builder recusa.
          allowDirtyBuild: true

      - name: Empacotar
        run: |
          cd build/StandaloneWindows64
          zip -r ../../RemoteChase-Windows.zip .

      - name: Publicar o zip no proprio run
        # Serve de download enquanto a VPS nao esta configurada.
        uses: actions/upload-artifact@v4
        with:
          name: RemoteChase-Windows
          path: RemoteChase-Windows.zip
          retention-days: 30

      - name: Enviar para a VPS
        # So roda quando os secrets da VPS existirem.
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: RemoteChase-Windows.zip
          target: ${{ secrets.VPS_PATH }}
